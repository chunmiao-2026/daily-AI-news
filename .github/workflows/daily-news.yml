name: 每日 AI 资讯推送 · AI 精选

on:
  # 由 cron-job.org 每天 9:03 POST 到 dispatches 端点触发（workflow_dispatch）
  # 也可手动：GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  push-news:
    name: 高质量 RSS 抓取 + DeepSeek AI 精选
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行推送（DeepSeek AI 精选）
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python push_news_v2.py
