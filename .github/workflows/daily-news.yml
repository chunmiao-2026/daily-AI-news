name: 每日 AI 资讯推送 · AI 精选

on:
  # 由 cron-job.org 每天 9:03 POST 到 dispatches 端点触发（workflow_dispatch）
  # 也可手动：GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  push-news:
    name: 高质量 RSS 抓取 + DeepSeek AI 精选
    runs-on: ubuntu-latest
    # 需要写权限，用于把 history.json（跨天去重历史）提交回仓库
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行推送（DeepSeek AI 精选）
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python push_news_v2.py

      - name: 提交去重历史 history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "history.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新跨天去重历史 history.json"
            git push
          fi
